[package]
name = "meteor-blitz"
version = "1.1.1"
edition = "2021"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[build-dependencies]
# Windows: the executable's icon and version info (build.rs).
winresource = "0.1"

[profile.release]
opt-level = 3

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "macos")))'.dependencies]
# XInput, not the default Windows.Gaming.Input: WGI dropped most inputs from
# an Xbox Wireless Controller over Bluetooth LE that XInput reads fine.
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString"] }
objc2-game-controller = { version = "0.3.2", features = ["GCController", "GCExtendedGamepad", "GCPhysicalInputProfile", "GCControllerElement", "GCControllerButtonInput", "GCControllerAxisInput", "GCControllerDirectionPad", "GCDevice", "GCDeviceHaptics"] }

# quad-snd 0.2.8 with a peak limiter on the mix (vendor/quad-snd/src/limiter.rs):
# upstream adds sounds with no headroom and the backends hard-clip the sum.
[patch.crates-io]
quad-snd = { path = "vendor/quad-snd" }
