<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meteor Blitz</title>
    <link rel="icon" type="image/png" href="./assets/icon/icon-64.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; }
      canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        color: #c8cbe0; font: 600 15px/1.4 system-ui, sans-serif; letter-spacing: 0.04em;
      }
      #loading .title { font-size: 28px; font-weight: 800; color: #eef0ff; letter-spacing: 0.12em; }
      #loading .bar { width: min(360px, 70vw); height: 6px; background: #1c1f2e; border-radius: 3px; overflow: hidden; }
      #loading .fill { width: 0%; height: 100%; background: linear-gradient(90deg, #4fd27a, #8be3ff); transition: width 0.15s; }
      #loading.error { color: #ff9a9a; }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" width="1280" height="720" tabindex="0"></canvas>
    <div id="loading">
      <div class="title">METEOR BLITZ</div>
      <div class="bar"><div class="fill"></div></div>
      <div class="status">Loading…</div>
    </div>
    <script src="./web/mq_js_bundle.js"></script>
    <script>
      // Web Audio adds every playing sound together and clips the sum, so
      // stacked explosions crackled. Everything bound for a context's output
      // goes through one limiter first (the desktop builds limit in the
      // mixer, vendor/quad-snd/src/limiter.rs): a 20:1 compressor above
      // -3 dBFS, a trim that cancels the make-up gain the Web Audio
      // compressor adds (the spec's 0.6 x the 2.85 dB it takes off a
      // full-scale signal: 1.71 dB, so audio under the threshold plays at its
      // own level), and a shaper that is linear to 0.9 and rounds anything the
      // compressor's attack lets through off below 1.0.
      (() => {
        const connect = AudioNode.prototype.connect;
        const limiters = new WeakMap();
        const shoulder = new Float32Array(4097);
        for (let i = 0; i < shoulder.length; i++) {
          const x = (i / (shoulder.length - 1)) * 2 - 1, a = Math.abs(x);
          shoulder[i] = Math.sign(x) * (a <= 0.9 ? a : 0.9 + 0.1 * Math.tanh((a - 0.9) / 0.1));
        }
        AudioNode.prototype.connect = function (target, ...rest) {
          if (target instanceof AudioDestinationNode && !(this instanceof WaveShaperNode)) {
            let limiter = limiters.get(target);
            if (!limiter) {
              const ctx = target.context;
              limiter = new DynamicsCompressorNode(ctx, { threshold: -3, knee: 0, ratio: 20, attack: 0.002, release: 0.08 });
              const trim = new GainNode(ctx, { gain: Math.pow(10, -1.71 / 20) });
              const shape = new WaveShaperNode(ctx, { curve: shoulder });
              connect.call(limiter, trim);
              connect.call(trim, shape);
              connect.call(shape, target);
              limiters.set(target, limiter);
            }
            target = limiter;
          }
          return connect.call(this, target, ...rest);
        };
      })();

      // miniquad reads keys from canvas.onkeydown, so the canvas must hold focus.
      const gameCanvas = document.getElementById("glcanvas");
      gameCanvas.focus();
      gameCanvas.addEventListener("mousedown", () => gameCanvas.focus());
      // Keys pressed while the canvas is not focused still reach the game.
      for (const type of ["keydown", "keyup"]) {
        window.addEventListener(type, (e) => {
          if (document.activeElement !== gameCanvas && gameCanvas["on" + type]) {
            gameCanvas["on" + type](e);
          }
        });
      }

      // Game controllers: the game reads the first connected pad through the
      // Gamepad API each frame (src/pad.rs): 4 axes, then 17 button values
      // in the standard layout. Returns 0 when no pad is connected.
      miniquad_add_plugin({
        name: "meteor_blitz_gamepad",
        version: 1,
        register_plugin: function (importObject) {
          importObject.env.mb_gamepad_read = function (ptr) {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            let pad = null;
            for (const p of pads) {
              if (p && p.connected && (pad === null || p.mapping === "standard")) pad = p;
            }
            if (pad === null) return 0;
            const out = new Float32Array(wasm_memory.buffer, ptr, 21);
            for (let i = 0; i < 4; i++) out[i] = pad.axes[i] || 0;
            for (let i = 0; i < 17; i++) out[4 + i] = pad.buttons[i] ? pad.buttons[i].value : 0;
            // 1 + the button-icon style: Sony (054c) and Nintendo (057e)
            // pads by id, anything else Xbox.
            const id = pad.id.toLowerCase();
            if (/054c|dualsense|dualshock|playstation/.test(id)) return 2;
            if (/057e|nintendo|pro controller|joy-con/.test(id)) return 3;
            return 1;
          };
          // Rumble (dual-rumble where the browser supports it).
          importObject.env.mb_gamepad_rumble = function (strong, weak, ms) {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            for (const p of pads) {
              if (p && p.connected && p.vibrationActuator) {
                p.vibrationActuator
                  .playEffect("dual-rumble", { duration: ms, strongMagnitude: strong, weakMagnitude: weak })
                  .catch(() => {});
                return;
              }
            }
          };
        },
      });

      // The game's data comes in one pack (tools/web_pack.py) instead of
      // hundreds of requests: file loads the pack holds are answered from
      // memory, anything else falls back to miniquad's own request.
      const pack = new Map();
      miniquad_add_plugin({
        name: "meteor_blitz_pack",
        version: 1,
        register_plugin: function (importObject) {
          const fetchFile = importObject.env.fs_load_file;
          importObject.env.fs_load_file = function (ptr, len) {
            const path = UTF8ToString(ptr, len).replace(/^\.\//, "");
            const data = pack.get(path);
            if (data === undefined) return fetchFile(ptr, len);
            const id = FS.unique_id;
            FS.unique_id += 1;
            FS.loaded_files[id] = data;
            // As miniquad's loader does, report it after this call returns.
            setTimeout(() => wasm_exports.file_loaded(id), 0);
            return id;
          };
        },
      });

      function unpack(buffer) {
        const view = new DataView(buffer);
        const bytes = new Uint8Array(buffer);
        const decoder = new TextDecoder();
        if (decoder.decode(bytes.subarray(0, 5)) !== "MBPK1") throw new Error("bad data pack");
        let at = 5;
        const count = view.getUint32(at, true);
        at += 4;
        for (let i = 0; i < count; i++) {
          const nameLength = view.getUint16(at, true);
          at += 2;
          const name = decoder.decode(bytes.subarray(at, at + nameLength));
          at += nameLength;
          const size = view.getUint32(at, true);
          at += 4;
          pack.set(name, bytes.subarray(at, at + size));
          at += size;
        }
      }

      const loading = document.getElementById("loading");
      const fill = loading.querySelector(".fill");
      const status = loading.querySelector(".status");

      async function start() {
        const response = await fetch("./web/data.pack.gz");
        if (!response.ok) throw new Error("data pack: HTTP " + response.status);
        const total = Number(response.headers.get("content-length")) || 0;
        const reader = response.body.getReader();
        const chunks = [];
        let received = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          if (total) {
            fill.style.width = Math.min(100, (received / total) * 100).toFixed(1) + "%";
            status.textContent = "Loading… " + (received / 1048576).toFixed(1) + " / " + (total / 1048576).toFixed(1) + " MB";
          }
        }
        status.textContent = "Starting…";
        const unzipped = new Blob(chunks).stream().pipeThrough(new DecompressionStream("gzip"));
        unpack(await new Response(unzipped).arrayBuffer());
        loading.remove();
        gameCanvas.focus();
        load("./web/meteor-blitz.wasm");
      }

      start().catch((e) => {
        loading.classList.add("error");
        status.textContent = "Could not load the game: " + e.message;
      });
    </script>
  </body>
</html>
