name: Release Builds (macOS, Windows, Linux / Steam Deck)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing or new release tag to attach packages to (e.g. v1.2.7; leave empty to only upload workflow artifacts)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64 (Steam Deck / glibc 2.31)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Run unit tests
        run: cargo test --locked --quiet

      - name: Package Linux / Steam Deck tarball (Debian 11 / glibc 2.31)
        run: bash tools/package-linux.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/MeteorBlitz-*-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64 (MSVC)
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: C:\t
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: cargo test --locked --quiet

      - name: Package Windows zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\package-windows.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/MeteorBlitz-*-windows.zip
          if-no-files-found: error

  macos:
    name: macOS Universal (arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Apple Silicon & Intel targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Run unit tests
        run: cargo test --locked --quiet

      - name: Package universal macOS DMG
        run: bash tools/package-macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/MeteorBlitz-*-macos.dmg
          if-no-files-found: error

  publish:
    name: Attach packages to GitHub Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh dist-all/
          ver="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-all/* --clobber
          else
            notes="docs/release-notes-${ver}.md"
            if [ -f "$notes" ]; then
              gh release create "$TAG" dist-all/* --title "Meteor Blitz $ver" --notes-file "$notes"
            else
              gh release create "$TAG" dist-all/* --title "Meteor Blitz $ver" --generate-notes
            fi
          fi
